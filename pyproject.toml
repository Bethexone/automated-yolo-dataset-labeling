[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-label"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai>=3.0", "Pillow>=11.0"]

[project.scripts]
dataset-label = "dataset_label.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
